services:
  ngrok-whatsapp:
    image: ngrok/ngrok:3
    command: http whatsapp-webhook:8000
    env_file:
      - ./services/ngrok/tunel_wh_whatsapp/.env
    ports:
      - "4040:4040"

  ngrok-mercadopago:
    image: ngrok/ngrok:3
    command: http payment-webhook:8002
    env_file:
      - ./services/ngrok/tunel_wh_mercado_pago/.env
    ports:
      - "4041:4040"

  whatsapp-webhook:
    build:
      context: ./services/whatsapp/webhook_whatsapp
      dockerfile: Dockerfile
    env_file:
      - ./services/whatsapp/webhook_whatsapp/.env
    depends_on:
      - redis
    ports:
      - "8000:8000"

  whatsapp-sender:
    build:
      context: ./services/whatsapp/system_whatsapp_sender
      dockerfile: Dockerfile
    env_file:
      - ./services/whatsapp/system_whatsapp_sender/.env
    depends_on:
      - redis
      - core
    ports:
      - "8001:8001"

  payment-webhook:
    build:
      context: ./services/payment/webhook_payment
      dockerfile: Dockerfile
    env_file:
      - ./services/payment/webhook_payment/.env
    depends_on:
      - redis
    ports:
      - "8002:8002"

  payment-system:
    build:
      context: ./services/payment/system_payment
      dockerfile: Dockerfile
    env_file:
      - ./services/payment/system_payment/.env
    depends_on:
      - redis
      - core
    ports:
      - "8003:8003"

  core:
    build:
      context: ./services/core
      dockerfile: Dockerfile
    env_file:
      - ./services/core/.env
    depends_on:
      - redis
      - db_hotel
      - db_payments
      - db_rag
      - ai
    ports:
      - "8080:8080"

  ai:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    entrypoint: ["ollama", "serve"]

  db_hotel:
    build:
      context: ./services/db/db_hotel
      dockerfile: Dockerfile
    env_file:
      - ./services/db/db_hotel/.env
    ports:
      - "5432:5432"
    volumes:
      - db_hotel_data:/var/lib/postgresql/data
      - ./services/db/db_hotel/init:/docker-entrypoint-initdb.d

  db_payments:
    build:
      context: ./services/db/db_payments
      dockerfile: Dockerfile
    env_file:
      - ./services/db/db_payments/.env
    ports:
      - "5433:5432"
    volumes:
      - db_payments_data:/var/lib/postgresql/data
      - ./services/db/db_payments/init:/docker-entrypoint-initdb.d

  db_rag:
    build:
      context: ./services/db/db_rag
      dockerfile: Dockerfile
    env_file:
      - ./services/db/db_rag/.env
    ports:
      - "5434:5432"
    volumes:
      - db_rag_data:/var/lib/postgresql/data
      - ./services/db/db_rag/init:/docker-entrypoint-initdb.d

  redis:
    build:
      context: ./services/db/redis
      dockerfile: Dockerfile
    env_file:
      - ./services/db/redis/.env
    ports:
      - "6379:6379"

volumes:
  ollama:
  db_hotel_data:
  db_payments_data:
  db_rag_data:
