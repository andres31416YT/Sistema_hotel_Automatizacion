services:
  ngrok-mercadopago:
    image: ngrok/ngrok:3
    command: http payment-webhook:8002
    env_file:
      - ./services/ngrok/tunel_wh_mercado_pago/.env
    ports:
      - "4041:4040"

  ngrok-whatsapp:
    image: ngrok/ngrok:3
    command: http whatsapp:2785
    env_file:
      - ./services/ngrok/tunel_wh_whatsapp/.env
    ports:
      - "4042:4040"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4040/api/tunnels"]
      interval: 3s
      timeout: 3s
      retries: 20

  whatsapp:
    image: ghcr.io/rmyndharis/openwa:latest
    ports:
      - "8001:2785"
    volumes:
      - whatsapp_data:/app/data
    env_file:
      - ./services/whatsapp/open_wa/.env
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:2785/', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 5s
      timeout: 3s
      retries: 10

  ngrok-core:
    image: ngrok/ngrok:3
    command: http core:8080
    env_file:
      - ./services/ngrok/tunel_core/.env
    ports:
      - "4043:4040"

  openwa-bootstrap:
    image: curlimages/curl:latest
    depends_on:
      - whatsapp
      - ngrok-whatsapp
      - ngrok-core-webhook-setup
    env_file:
      - ./services/whatsapp/open_wa/.env
    user: root
    volumes:
      - whatsapp_data:/app/data
      - ./services/whatsapp/open_wa/bootstrap.sh:/bootstrap.sh:ro
      - ./services/core/.env:/project/services/core/.env:rw
    entrypoint: ["sh", "/bootstrap.sh"]
    restart: "no"

  ngrok-core-webhook-setup:
    image: curlimages/curl:latest
    depends_on:
      - ngrok-core
    env_file:
      - ./services/ngrok/tunel_core/.env
    user: root
    volumes:
      - ./services/ngrok/tunel_core/setup_core_webhook.sh:/setup_core_webhook.sh:ro
      - ./services/whatsapp/open_wa/.env:/project/services/whatsapp/open_wa/.env:rw
    entrypoint: ["sh", "/setup_core_webhook.sh"]
    restart: "no"

  payment-webhook:
    build:
      context: ./services/payment/webhook_payment
      dockerfile: Dockerfile
    env_file:
      - ./services/payment/webhook_payment/.env
    depends_on:
      - redis
    ports:
      - "8002:8002"

  payment-system:
    build:
      context: ./services/payment/system_payment
      dockerfile: Dockerfile
    env_file:
      - ./services/payment/system_payment/.env
    depends_on:
      - redis
      - core
    ports:
      - "8003:8003"

  core:
    build:
      context: ./services/core
      dockerfile: Dockerfile
    env_file:
      - ./services/core/.env
    depends_on:
      - redis
      - db_hotel
      - db_payments
      - db_rag
      - ai
      - whatsapp
    ports:
      - "8080:8080"
    volumes:
      - core_data:/core/data

  ai:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_NUM_GPU: "999"
      OLLAMA_FLASH_ATTENTION: "true"
      OLLAMA_KV_CACHE_TYPE: "f16"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["ollama", "serve"]

  db_hotel:
    build:
      context: ./services/db/db_hotel
      dockerfile: Dockerfile
    env_file:
      - ./services/db/db_hotel/.env
    ports:
      - "5432:5432"
    volumes:
      - db_hotel_data:/var/lib/postgresql/data
      - ./services/db/db_hotel/init:/docker-entrypoint-initdb.d

  db_payments:
    build:
      context: ./services/db/db_payments
      dockerfile: Dockerfile
    env_file:
      - ./services/db/db_payments/.env
    ports:
      - "5433:5432"
    volumes:
      - db_payments_data:/var/lib/postgresql/data
      - ./services/db/db_payments/init:/docker-entrypoint-initdb.d

  db_rag:
    build:
      context: ./services/db/db_rag
      dockerfile: Dockerfile
    env_file:
      - ./services/db/db_rag/.env
    ports:
      - "5434:5432"
    volumes:
      - db_rag_data:/var/lib/postgresql/data
      - ./services/db/db_rag/init:/docker-entrypoint-initdb.d

  redis:
    build:
      context: ./services/db/redis
      dockerfile: Dockerfile
    env_file:
      - ./services/db/redis/.env
    ports:
      - "6379:6379"

volumes:
  ollama:
  db_hotel_data:
  db_payments_data:
  db_rag_data:
  core_data:
  whatsapp_data:
